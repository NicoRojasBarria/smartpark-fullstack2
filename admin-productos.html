<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Productos - SmartPark</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>

    <header>
        <img src="assets/LogoSmartPark.png"
            alt="Logo SmartPark"
            class="logo-smartpark">
        <h1>SmartPark - Administración</h1>
    </header>

    <main class="admin-layout">

        <nav class="menu-admin">
            <ul>
                <li class="solo-administrador">
                    <a href="admin.html">Inicio</a>
                </li>

                <li>
                    <a href="admin-productos.html">Productos</a>
                </li>

                <li>
                    <a href="admin-ordenes.html">Órdenes</a>
                </li>

                <li class="solo-administrador">
                    <a href="admin-usuarios.html">Usuarios</a>
                </li>

                <li>
                    <a href="index.html">Tienda</a>
                </li>
            </ul>
        </nav>

        <section class="contenido-admin">

            <h2>Administración de Productos</h2>

            <form id="formulario-producto" class="solo-administrador">

                <label for="codigo-producto">Código:</label>
                <input type="text" id="codigo-producto" minlength="3">

                <br><br>

                <label for="nombre-producto">Nombre:</label>
                <input type="text" id="nombre-producto" maxlength="100">

                <br><br>

                <label for="descripcion-producto">Descripción:</label>
                <textarea id="descripcion-producto" maxlength="500"></textarea>

                <br><br>

                <label for="precio-producto">Precio:</label>
                <input type="number" id="precio-producto" min="0" step="0.01">

                <br><br>

                <label for="stock-producto">Stock:</label>
                <input type="number" id="stock-producto" min="0" step="1">

                <br><br>

                <label for="stock-critico">Stock crítico:</label>
                <input type="number" id="stock-critico" min="0" step="1">

                <br><br>

                <label for="categoria-producto">Categoría:</label>
                <select id="categoria-producto">
                    <option value="">Seleccione una categoría</option>
                    <option value="Centro">Centro</option>
                    <option value="Mall">Mall</option>
                    <option value="Aeropuerto">Aeropuerto</option>
                </select>

                <br><br>

                <label for="imagen-producto">Imagen:</label>
                <input type="file" id="imagen-producto">

                <br><br>

                <button type="submit">Guardar producto</button>

            </form>

            <h2>Listado de Productos</h2>

            <div id="lista-productos-admin"></div>

        </section>

    </main>

    <footer>
        <p>SmartPark - Elvira San Martín y Nicolás Rojas - 2026</p>
    </footer>

    <script src="funciones.js"></script>

    <script>
        protegerPaginaProductos();
        controlarVistaProductos();
    </script>

</body>

</html>
