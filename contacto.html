<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - SmartPark</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>

    <header>
        <h1>SmartPark</h1>
        <p>Encuentra tu estacionamiento de forma rápida y segura</p>

        <nav>
            <p>
                <a href="index.html">Inicio</a> |
                <a href="productos.html">Productos</a> |
                <a href="nosotros.html">Nosotros</a> |
                <a href="blog.html">Blog</a> |

            </p>
        </nav>

        <p class="leyenda">Encuentra, reserva y gestiona tu estacionamiento con SmartPark</p>
    </header>

    <main>

        <section>
            <h2>Contacto</h2>

            <form id="formulario-contacto">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" maxlength="100">

                <br><br>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" maxlength="100">

                <br><br>

                <label for="comentario">Comentario:</label>
                <textarea id="comentario" maxlength="500"></textarea>

                <br><br>

                <button type="submit">Enviar</button>

            </form>

        </section>

    </main>

    <script src="funciones.js"></script>

</body>

</html>
