<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartPark</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>

    <header>
        <h1>SmartPark</h1>
        <p>Encuentra tu estacionamiento de forma rápida y segura</p>

        <nav>
            <p>
                <a href="index.html">Inicio</a> |
                <a href="productos.html">Productos</a> |
                <a href="nosotros.html">Nosotros</a> |
                <a href="blog.html">Blog</a> |

        <p class="leyenda">Encuentra, reserva y gestiona tu estacionamiento con SmartPark</p>
    </header>

    <main>

        <section>
            <h2>Iniciar sesión</h2>

            <form id="formulario-login">

                <label for="email-login">Correo electrónico:</label>
                <input type="email" id="email-login" maxlength="100">

                <br><br>

                <label for="password-login">Contraseña:</label>
                <input type="password" id="password-login" minlength="4" maxlength="10">

                <br><br>

                <button type="submit">Ingresar</button>

            </form>

        </section>

    </main>

    <script src="funciones.js"></script>

</body>
